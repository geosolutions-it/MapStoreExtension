# Creates the MapStoreExtension release vYYYY.MM.mm from a stable branch (YYYY.MM.xx),
# with SampleExtension.zip attached and release notes generated by GitHub.
# The MapStore2 submodule must already include the MapStore2 tag vYYYY.MM.mm
# (run "Update Submodules" on the stable branch after the MapStore2 release is tagged).

name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v prefix (format: YYYY.MM.mm, e.g. 2026.03.00). Run it from the stable branch YYYY.MM.xx'
        required: true
      draft:
        description: 'Create the release as draft (publish it by hand from the releases page)'
        type: boolean
        default: true

concurrency: release-${{ github.ref }}

# read-only by default, only the release job can write
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version, branch and MapStore2 submodule
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "::error::Version must be YYYY.MM.mm without the v prefix, got '$VERSION'"
            exit 1
          fi
          if [ "$BRANCH" != "${VERSION%.*}.xx" ]; then
            echo "::error::Run this workflow from the branch ${VERSION%.*}.xx, not from $BRANCH"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists in this repository"
            exit 1
          fi
          # commit of MapStore2 recorded for the submodule on this branch
          SUBMODULE_SHA=$(git ls-tree HEAD MapStore2 | awk '{print $3}')
          if ! STATUS=$(gh api "repos/geosolutions-it/MapStore2/compare/v$VERSION...$SUBMODULE_SHA" --jq .status); then
            echo "::error::Tag v$VERSION not found in MapStore2"
            exit 1
          fi
          # identical: submodule on the tag; ahead: submodule on a later commit of the stable branch
          if [ "$STATUS" != "identical" ] && [ "$STATUS" != "ahead" ]; then
            echo "::error::MapStore2 submodule ($SUBMODULE_SHA) does not include v$VERSION ($STATUS). Run \"Update Submodules\" on $BRANCH first"
            exit 1
          fi
          echo "MapStore2 submodule at $SUBMODULE_SHA ($STATUS with v$VERSION)"

  build:
    needs: check
    uses: ./.github/workflows/checks.yml
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download SampleExtension.zip
        uses: actions/download-artifact@v5
        with:
          name: Artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: ${{ inputs.draft }}
          files: SampleExtension.zip
          fail_on_unmatched_files: true
